# Orquestación: API Flask + PostgreSQL
# Ambos contenedores comparten la red "tareas_net" y se descubren por nombre DNS.

services:
  db:
    image: postgres:16-alpine
    container_name: tareas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareas_db}
      POSTGRES_USER: ${POSTGRES_USER:-tareas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tareas_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tareas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tareas_user} -d ${POSTGRES_DB:-tareas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tareas_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tareas_user}:${POSTGRES_PASSWORD:-tareas_pass}@db:5432/${POSTGRES_DB:-tareas_db}
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tareas_net

networks:
  tareas_net:
    driver: bridge
    name: tareas_net

volumes:
  db_data:
    name: tareas_db_data
